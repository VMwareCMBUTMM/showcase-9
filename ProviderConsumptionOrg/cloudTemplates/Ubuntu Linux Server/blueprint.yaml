formatVersion: 2
name: Ubuntu Linux Server
description: Deploy various versions of Ubuntu Server
version: 1
inputs:
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vm_name:
    type: string
    title: Virtual Machine Name
    description: Enter a name for the Virtual Machine
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
  os_version:
    type: string
    title: Virtual Machine Size
    description: Select a Ubuntu Version
    default: vmi-254818e8ba87082b4
    oneOf:
      - title: Ubuntu 18.04
        const: vmi-7eb4f6375da7f7198
      - title: Ubuntu 20.04
        const: vmi-a2b8f5caa63e7baf0
      - title: Ubuntu 22.04
        const: vmi-3d4355b8ab4c4bdcb
      - title: Ubuntu 24.04
        const: vmi-254818e8ba87082b4
  storageClass:
    type: string
    title: Storage Class
    $data: /data/storageclasses?namespace={{namespace}}
  vm_size:
    type: string
    title: Virtual Machine Size
    description: Select a Virtual Machine Size
    $data: /data/virtualmachineclasses?namespace={{namespace}}
  username:
    type: string
    description: The username you would like to have for the admin account.
    default: demouser
    title: Admin Username
  password:
    type: string
    description: The password you would like to use for the admin account.
    title: Admin Password
    default: VMware1!
    pattern: '[a-z0-9A-Z@#$]+'
    encrypted: true
resources:
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  SSH_LB:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachineService
        metadata:
          name: ${input.vm_name}
        spec:
          selector:
            vm-lb-selector: ${input.vm_name}
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
  VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - BOOTSTRAP
      - SSH_LB
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.vm_name}
          labels:
            vm-selector: ${input.vm_name}
            vm-lb-selector: ${input.vm_name}
        spec:
          className: ${input.vm_size}
          imageName: ${input.os_version}
          storageClass: ${input.storageClass}
          powerState: PoweredOn
          network:
            domainName: showcase.tmm.broadcom.lab
            nameservers:
              - 10.138.241.1
              - 10.138.241.2
            searchDomains:
              - showcase.tmm.broadcom.lab
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${input.vm_name}-bootstrap-secret
                key: user-data
  BOOTSTRAP:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.vm_name}-bootstrap-secret
          labels:
            vm-selector: ${input.vm_name}
        stringData:
          user-data: |
            #cloud-config
            hostname: ${input.vm_name}
            package_upgrade: true
            package_reboot_if_required: true
            apt_source:
              - source: deb http://archive.ubuntu.com/ubuntu main universe multiverse restricted

            packages:
              - open-vm-tools

            ssh_pwauth: true

            users:
              - name: ${input.username}
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: [sudo]
                shell: /bin/bash

            chpasswd:
              users:
                - name: ${input.username}
                  password: ${input.password}
                  type: text
              expire: false

            runcmd:
              - echo 'Cloud-init is done!' >> /tmp/finished.txt
