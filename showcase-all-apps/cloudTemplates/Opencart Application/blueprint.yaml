formatVersion: 2
name: Opencart Application
description: Opencart Application with MySQL VM, VKS Cluster, Istio Ingress Gateway, cert-manager, and HTTPS sslip.io endpoint
version: 1
metadata:
  deploymentSettings:
    disableUpdateDay2Action: true
    hideDisabledDay2Actions: true
outputs:
  __deploymentOverview:
    value: |-
      ## Opencart Shopping Cart Application
      Opencart is an easy to-use, powerful, Open Source online store management program that can manage multiple online stores from a single back-end.
      For more details, check https://www.opencart.com/

      ### Application Details

      **OpenCart HTTPS Url :** ${resource.Opencart_CM.object.data["cart-url"]}

      **OpenCart HTTP Url  :** ${resource.Opencart_CM.object.data["cart-http-url"]}

      **Gateway Ingress IP :** ${resource.Opencart_CM.object.data["ingress-ip"]}

      **MySQL Host IP      :** ${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}
  openCartUrl:
    value: ${resource.Opencart_CM.object.data["cart-url"]}
    description: OpenCart HTTPS Application URL
  openCartHttpUrl:
    value: ${resource.Opencart_CM.object.data["cart-http-url"]}
    description: OpenCart HTTP Application URL
  openCartIngressIp:
    value: ${resource.Opencart_CM.object.data["ingress-ip"]}
    description: Istio Gateway Ingress IP
  mysqlHostIp:
    value: ${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}
    description: MySQL Database Load Balancer IP
inputs:
############################################
# Dynamic Data Retrieval for Known objects #
############################################
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vm_size:
    type: string
    title: Virtual Machine Class
    default: best-effort-large
    $data: /data/virtualmachineclasses?namespace={{namespace}}
  storageclass:
    type: string
    title: Storage Class
    $data: /data/storageclasses?namespace={{namespace}}
#############################################
  controlPlaneCount:
    type: integer
    title: VKS ControlPlane Node count
    description: Control plane node count
    default: 1
    enum:
      - 1
      - 3
  minWorkerCount:
    type: string
    title: Min VKS Worker Node count
    description: Minimum VKS Worker node count
    default: '1'
    oneOf:
      - title: 1
        const: '1'
      - title: 2
        const: '2'
      - title: 3
        const: '3'
  maxWorkerCount:
    type: string
    title: Max VKS Worker Node count
    description: Maximum VKS Worker node count
    default: '2'
    oneOf:
      - title: 1
        const: '1'
      - title: 2
        const: '2'
      - title: 3
        const: '3'
      - title: 4
        const: '4'
      - title: 5
        const: '5'
  username:
    type: string
    description: The username you would like to have for the installation.
    default: demouser
    title: System Admin Account Username
  password:
    type: string
    description: The password you would like to use for the ocuser account.
    title: OpenCart Admin Account Password
    pattern: '[a-z0-9A-Z@#$]+'
    default: VMware1!
    encrypted: true
resources:
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  VKS_Job_SA:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-vks-job-sa
  MYSQL_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - BOOTSTRAP
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
        spec:
          className: ${input.vm_size}
          # Friendly image name: ubuntu-24.04-lts-noble-server-cloudimg-amd64
          imageName: ${propgroup.environment.ubuntu2404}
          storageClass: ${input.storageclass}
          powerState: PoweredOn
          network:
            domainName: ${propgroup.environment.domain}
            nameservers:
              - ${propgroup.environment.nameserver1}
              - ${propgroup.environment.nameserver2}
            searchDomains:
              - ${propgroup.environment.domain}
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${to_k8s_name(env.deploymentName, 63)}-oc-sql-bootstrap-secret
                key: user-data
  BOOTSTRAP:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-oc-sql-bootstrap-secret
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
        stringData:
          user-data: |
            #cloud-config
            hostname: ${self.resourceName}
            package_update: true
            package_upgrade: true

            packages:
              - mysql-server
              - mysql-client-core-8.0
              - unzip
              - open-vm-tools

            ssh_pwauth: true

            users:
              - name: ${input.username}
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: wheel, sudo, admin
                shell: /bin/bash

              - name: ocuser
                sudo: ['ALL=(ALL) NOPASSWD:ALL']
                groups: sudo
                shell: /bin/bash

            chpasswd:
              expire: false
              users:
                - name: ${input.username}
                  password: ${input.password}
                  type: text
                  
                - name: ocuser
                  password: ${input.password}
                  type: text
              
            write_files:
              - path: /root/.my.cnf
                owner: root:root
                permissions: '0600'
                content: |
                  [client]
                  user=root
                  password="${input.password}"

              - path: /etc/mysql/conf.d/client.cnf
                owner: root:root
                permissions: '0600'
                content: |
                  [client]
                  user=root
                  password="${input.password}"

              - path: /etc/cron.hourly/oc_cleanup
                owner: root:root
                permissions: '0755'
                content: "mysql -e 'use opencart; create table oc_session_copy like oc_session; drop table oc_session; rename table oc_session_copy to oc_session;'"
              
              - path: /etc/hosts
                content: |
                  127.0.0.1 ${to_k8s_name(env.deploymentName, 63)}-oc-sql
                  185.125.190.82 security.ubuntu.com
                  185.125.190.82 archive.ubuntu.com
                append: true

            runcmd:
              - systemctl enable --now mysql
              - |
                export HOME=/root
                set -e

                # Configure root password
                mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${input.password}'; FLUSH PRIVILEGES;"

                # Allow remote MySQL connections
                sed -i "s/^[[:space:]]*bind-address[[:space:]]*=.*/bind-address = 0.0.0.0/" /etc/mysql/mysql.conf.d/mysqld.cnf

                # Disable MySQL TLS.
                # Required for the OpenCart MariaDB client used by this blueprint.
                if ! grep -q "^[[:space:]]*skip_ssl" /etc/mysql/mysql.conf.d/mysqld.cnf; then
                    sed -i "/^\[mysqld\]/a skip_ssl" /etc/mysql/mysql.conf.d/mysqld.cnf
                fi

                systemctl restart mysql

                # Create OpenCart database user and database
                mysql -u root -p"${input.password}" -e "CREATE USER IF NOT EXISTS 'ocuser'@'%' IDENTIFIED BY '${input.password}';"
                mysql -u root -p"${input.password}" -e "GRANT ALL PRIVILEGES ON *.* TO 'ocuser'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
                mysql -u root -p"${input.password}" -e "CREATE DATABASE IF NOT EXISTS opencart;"

                echo "Cloud-init is done!" >> /tmp/finished.txt
  CM_Role:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS_Job_SA
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-configmap-manager
        rules:
          - apiGroups:
              - ''
            resources:
              - configmaps
            verbs:
              - get
              - list
              - watch
              - create
              - delete
              - patch
  SSH_MYSQL_LB:
    type: CCI.Supervisor.Resource
    dependsOn:
      - MYSQL_VM
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
        spec:
          selector:
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-oc-sql
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
            - name: mysql
              protocol: TCP
              port: 3306
              targetPort: 3306
  CM_Role_Binding:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CM_Role
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-configmap-manager-binding
        subjects:
          - kind: ServiceAccount
            name: ${to_k8s_name(env.deploymentName, 63)}-vks-job-sa
        roleRef:
          kind: Role
          name: ${to_k8s_name(env.deploymentName, 63)}-configmap-manager
          apiGroup: rbac.authorization.k8s.io
  VKS_Job:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS_Bootstrap
      - CM_Role_Binding
      - SSH_MYSQL_LB
    createTimeout: 120m
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: vks-job-${env.shortDeploymentId}
        spec:
          completions: 1
          parallelism: 1
          ttlSecondsAfterFinished: 600
          backoffLimit: 0
          template:
            spec:
              serviceAccountName: ${to_k8s_name(env.deploymentName, 63)}-vks-job-sa
              containers:
                - name: vks-job
                  image: paif.packages.broadcom.com/tkg-gpu-console:9.0.0.0
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: '2'
                      memory: 4Gi
                  volumeMounts:
                    - name: cluster-kubeconfig-volume
                      mountPath: /etc/vks-kubeconfig
                      readOnly: true
                  command:
                    - /bin/bash
                    - '-c'
                  args:
                    - |

                      # Function to set KUBECONFIG to VKS KubeConfig
                      set_vks_kubeconfig() {
                        export KUBECONFIG=/etc/vks-kubeconfig/vks-cluster-kubeconfig-admin
                        echo "Waiting for VKS cluster API server to respond..."
                        until kubectl get nodes >/dev/null 2>&1; do
                          echo "Waiting for VKS cluster API server..."
                          sleep 5
                        done
                        echo "Success: VKS Kubeconfig retrieved and cluster is responding"
                      }

                      # Call the set_vks_kubeconfig() function
                      set_vks_kubeconfig

                      # create and patch the opencart namespace pod-security inside VKS cluster
                      #=======================================
                      kubectl get ns opencart >/dev/null 2>&1 || kubectl create namespace opencart

                      #Patch the namespace with a pod-security privileged label
                      #=======================================
                      kubectl label ns opencart pod-security.kubernetes.io/enforce=privileged --overwrite

                      # Wait for cert-manager to be fully ready
                      #=======================================
                      echo "Waiting for cert-manager to become fully ready..."
                      until kubectl get crd certificates.cert-manager.io clusterissuers.cert-manager.io >/dev/null 2>&1; do
                        echo "Waiting for cert-manager CRDs to be created..."
                        sleep 5
                      done
                      kubectl wait --for=condition=Established crd/certificates.cert-manager.io crd/clusterissuers.cert-manager.io --timeout=10m

                      until kubectl get deployment/cert-manager deployment/cert-manager-cainjector deployment/cert-manager-webhook -n cert-manager >/dev/null 2>&1; do
                        echo "Waiting for cert-manager deployments..."
                        sleep 5
                      done
                      kubectl wait --for=condition=Available deployment/cert-manager deployment/cert-manager-cainjector deployment/cert-manager-webhook -n cert-manager --timeout=10m
                      echo "Success: cert-manager is ready"

                      # Wait for Gateway API and Istio to be ready
                      #=======================================
                      echo "Waiting for Gateway API to become ready..."
                      until kubectl get crd gateways.gateway.networking.k8s.io httproutes.gateway.networking.k8s.io >/dev/null 2>&1; do
                        echo "Waiting for Gateway API CRDs..."
                        sleep 5
                      done
                      kubectl wait --for=condition=Established crd/gateways.gateway.networking.k8s.io crd/httproutes.gateway.networking.k8s.io --timeout=10m
                      echo "Success: Gateway API CRDs are ready"

                      echo "Waiting for Istio to become ready..."
                      until kubectl get deployment/istiod -n istio-system >/dev/null 2>&1; do
                        echo "Waiting for istiod deployment..."
                        sleep 5
                      done
                      kubectl wait --for=condition=Available deployment/istiod -n istio-system --timeout=10m
                      echo "Success: istiod is ready"

                      # Helper function to apply manifests with retries
                      #=======================================
                      apply_with_retry() {
                        local desc="$1"
                        local manifest="$2"
                        local max_attempts=15
                        local delay=5
                        local attempt=1
                        echo "Applying $desc..."
                        while [ $attempt -le $max_attempts ]; do
                          if echo "$manifest" | kubectl apply -f -; then
                            echo "Success: $desc applied"
                            return 0
                          fi
                          echo "Warning: Failed to apply $desc (attempt $attempt/$max_attempts). Retrying in $delay s..."
                          sleep $delay
                          attempt=$((attempt + 1))
                        done
                        echo "Failure: Timed out applying $desc"
                        exit 1
                      }

                      # Allow webhook endpoints 10s to fully register with API server
                      #=======================================
                      echo "Waiting 10s for admission webhooks to settle..."
                      sleep 10

                      # Configure containerd skip_verify for Harbor
                      #=======================================
                      echo "Configuring containerd skip_verify for Harbor (${propgroup.environment.harbor})..."
                      cat <<EOF | kubectl apply -f -
                      apiVersion: apps/v1
                      kind: DaemonSet
                      metadata:
                        name: containerd-harbor-trust
                        namespace: kube-system
                      spec:
                        selector:
                          matchLabels:
                            name: containerd-harbor-trust
                        template:
                          metadata:
                            labels:
                              name: containerd-harbor-trust
                          spec:
                            hostNetwork: true
                            tolerations:
                              - effect: NoSchedule
                                operator: Exists
                              - effect: NoExecute
                                operator: Exists
                            containers:
                              - name: patch-containerd
                                image: paif.packages.broadcom.com/tkg-gpu-console:9.0.0.0
                                command:
                                  - /bin/sh
                                  - -c
                                  - |
                                    mkdir -p /etc/containerd/certs.d/${propgroup.environment.harbor}
                                    printf 'server = "https://${propgroup.environment.harbor}"\n\n[host."https://${propgroup.environment.harbor}"]\n  capabilities = ["pull", "resolve"]\n  skip_verify = true\n' > /etc/containerd/certs.d/${propgroup.environment.harbor}/hosts.toml
                                    echo "Configured skip_verify for ${propgroup.environment.harbor}"
                                    sleep infinity
                                volumeMounts:
                                  - name: containerd-certs
                                    mountPath: /etc/containerd/certs.d
                            volumes:
                              - name: containerd-certs
                                hostPath:
                                  path: /etc/containerd/certs.d
                                  type: DirectoryOrCreate
                      EOF

                      echo "Waiting for containerd trust DaemonSet to rollout..."
                      kubectl rollout status daemonset/containerd-harbor-trust -n kube-system --timeout=120s


                      # Create self-signed ClusterIssuer for OpenCart
                      #=======================================
                      apply_with_retry "ClusterIssuer opencart-issuer" "
                      apiVersion: cert-manager.io/v1
                      kind: ClusterIssuer
                      metadata:
                        name: opencart-issuer
                      spec:
                        selfSigned: {}
                      "

                      # Create Istio Gateway for OpenCart (HTTP & HTTPS)
                      #=======================================
                      apply_with_retry "Gateway opencart-gateway" "
                      apiVersion: gateway.networking.k8s.io/v1
                      kind: Gateway
                      metadata:
                        name: opencart-gateway
                        namespace: opencart
                        annotations:
                          cert-manager.io/cluster-issuer: opencart-issuer
                      spec:
                        gatewayClassName: istio
                        listeners:
                          - name: http
                            port: 80
                            protocol: HTTP
                            allowedRoutes:
                              namespaces:
                                from: All
                          - name: https
                            port: 443
                            protocol: HTTPS
                            allowedRoutes:
                              namespaces:
                                from: All
                            tls:
                              mode: Terminate
                              certificateRefs:
                                - group: \"\"
                                  kind: Secret
                                  name: opencart-tls
                      "

                      # Wait for Istio Gateway to receive an External LoadBalancer IP
                      #=======================================
                      echo "Waiting for Istio Gateway External IP..."
                      timeout=300
                      elapsed=0
                      while [ -z "$(kubectl get svc opencart-gateway-istio -n opencart -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)" ]; do
                        if [ $elapsed -ge $timeout ]; then
                          echo "Failure: Timed out waiting for Istio Gateway IP"
                          kubectl get svc -n opencart
                          exit 1
                        fi
                        sleep 5
                        elapsed=$((elapsed + 5))
                      done

                      INGRESS_IP=$(kubectl get svc opencart-gateway-istio -n opencart -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                      OPENCART_DOMAIN="opencart.$INGRESS_IP.sslip.io"
                      echo "Success: Istio Gateway IP is: $INGRESS_IP"
                      echo "Success: OpenCart domain is: $OPENCART_DOMAIN"

                      # Issue Certificate for the domain
                      #=======================================
                      apply_with_retry "Certificate opencart-tls" "
                      apiVersion: cert-manager.io/v1
                      kind: Certificate
                      metadata:
                        name: opencart-tls
                        namespace: opencart
                      spec:
                        dnsNames:
                          - $OPENCART_DOMAIN
                        issuerRef:
                          kind: ClusterIssuer
                          name: opencart-issuer
                        secretName: opencart-tls
                      "

                      echo "Waiting for Certificate opencart-tls to be issued..."
                      kubectl wait --for=condition=Ready certificate/opencart-tls -n opencart --timeout=5m
                      echo "Success: Certificate opencart-tls is issued"

                      # Create Backend ClusterIP Service for OpenCart
                      #=======================================
                      apply_with_retry "Service my-open-cart-svc" "
                      apiVersion: v1
                      kind: Service
                      metadata:
                        name: my-open-cart-svc
                        namespace: opencart
                        labels:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                      spec:
                        type: ClusterIP
                        ports:
                          - name: http
                            port: 8080
                            protocol: TCP
                            targetPort: http
                          - name: https
                            port: 8443
                            protocol: TCP
                            targetPort: https
                        selector:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                      "

                      # Create HTTPRoute pointing to OpenCart Service
                      #=======================================
                      apply_with_retry "HTTPRoute opencart-route" "
                      apiVersion: gateway.networking.k8s.io/v1
                      kind: HTTPRoute
                      metadata:
                        name: opencart-route
                        namespace: opencart
                      spec:
                        hostnames:
                          - $OPENCART_DOMAIN
                        parentRefs:
                          - group: gateway.networking.k8s.io
                            kind: Gateway
                            name: opencart-gateway
                            namespace: opencart
                        rules:
                          - backendRefs:
                              - group: \"\"
                                kind: Service
                                name: my-open-cart-svc
                                port: 8080
                                weight: 1
                            matches:
                              - path:
                                  type: PathPrefix
                                  value: /
                      "

                      # Create endpoints ConfigMap on the Supervisor Namespace
                      #============================================================= 
                      unset KUBECONFIG
                      kubectl create configmap ${to_k8s_name(env.deploymentName, 63)}-opencart-endpoints \
                        --from-literal=ingress-ip=$INGRESS_IP \
                        --from-literal=cart-url=https://$OPENCART_DOMAIN \
                        --from-literal=cart-http-url=http://$OPENCART_DOMAIN \
                        --dry-run=client -o yaml | kubectl apply -f -
                      echo "Success: Created ConfigMap ${to_k8s_name(env.deploymentName, 63)}-opencart-endpoints in supervisor namespace"

                      # Re-set KUBECONFIG to VKS guest cluster
                      set_vks_kubeconfig

                      # Create PVC for OpenCart
                      #=======================================
                      cat <<EOF | kubectl create -f -
                      apiVersion: v1
                      kind: PersistentVolumeClaim
                      metadata:
                        labels:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                        name: open-cart-pvc
                        namespace: opencart
                      spec:
                        accessModes:
                          - ReadWriteOnce
                        resources:
                          requests:
                            storage: 8Gi
                        storageClassName: ${input.storageclass}
                      EOF

                      # Create Opencart Password Secret
                      #=======================================
                      cat <<EOF | kubectl create -f -
                      apiVersion: v1
                      data:
                        opencart-password: ${base64_encode(input.password)}
                      kind: Secret
                      metadata:
                        labels:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                        name: open-cart-oc-password
                        namespace: opencart
                      type: Opaque
                      EOF

                      # Create MariaDB Password Secret
                      #=======================================
                      cat <<EOF | kubectl create -f -
                      apiVersion: v1
                      data:
                        mariadb-password: ${base64_encode(input.password)}
                      kind: Secret
                      metadata:
                        labels:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                        name: my-open-externaldb
                        namespace: opencart
                      type: Opaque
                      EOF

                      # Create Frontend Web Deployment with HTTPS enabled
                      #=======================================
                      cat <<EOF | kubectl create -f -
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        generation: 1
                        labels:
                          app.kubernetes.io/instance: my-open-cart
                          app.kubernetes.io/name: opencart
                        name: my-open-cart-app
                        namespace: opencart
                      spec:
                        progressDeadlineSeconds: 1200
                        replicas: 1
                        revisionHistoryLimit: 10
                        selector:
                          matchLabels:
                            app.kubernetes.io/instance: my-open-cart
                            app.kubernetes.io/name: opencart
                        strategy:
                          rollingUpdate:
                            maxSurge: 25%
                            maxUnavailable: 25%
                          type: RollingUpdate
                        template:
                          metadata:
                            labels:
                              app.kubernetes.io/instance: my-open-cart
                              app.kubernetes.io/name: opencart
                          spec:
                            #imagePullSecrets:
                            #  - name: regcred
                            affinity:
                              podAntiAffinity:
                                preferredDuringSchedulingIgnoredDuringExecution:
                                  - podAffinityTerm:
                                      labelSelector:
                                        matchLabels:
                                          app.kubernetes.io/instance: my-open-cart
                                          app.kubernetes.io/name: opencart
                                      topologyKey: kubernetes.io/hostname
                                    weight: 1
                            containers:
                              - env:
                                  - name: BITNAMI_DEBUG
                                    value: 'false'
                                  - name: ALLOW_EMPTY_PASSWORD
                                    value: to_string(yes)
                                  - name: APACHE_HTTP_PORT_NUMBER
                                    value: '8080'
                                  - name: APACHE_HTTPS_PORT_NUMBER
                                    value: '8443'
                                  - name: OPENCART_DATABASE_HOST
                                    value: '${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}'
                                  - name: OPENCART_DATABASE_PORT_NUMBER
                                    value: '3306'
                                  - name: OPENCART_DATABASE_NAME
                                    value: opencart
                                  - name: OPENCART_DATABASE_USER
                                    value: ocuser
                                  - name: OPENCART_DATABASE_PASSWORD
                                    valueFrom:
                                      secretKeyRef:
                                        key: mariadb-password
                                        name: my-open-externaldb
                                  - name: OPENCART_SKIP_BOOTSTRAP
                                    value: 'no'
                                  - name: OPENCART_ENABLE_HTTPS
                                    value: 'yes'
                                  - name: OPENCART_HOST
                                    value: '$OPENCART_DOMAIN'
                                  - name: OPENCART_USERNAME
                                    value: user
                                  - name: OPENCART_PASSWORD
                                    valueFrom:
                                      secretKeyRef:
                                        key: opencart-password
                                        name: open-cart-oc-password
                                  - name: OPENCART_EMAIL
                                    value: user@example.com
                                command:
                                  - /bin/bash
                                  - -c
                                args:
                                  - |
                                    printf "[client]\ndisable-ssl\n" > /tmp/.my.cnf
                                    export HOME=/tmp
                                    exec /opt/bitnami/scripts/opencart/entrypoint.sh /opt/bitnami/scripts/apache/run.sh
                                image: ${propgroup.environment.harbor}/docker/bitnamilegacy/opencart-archived:4.0.2-3-debian-12-r36
                                imagePullPolicy: IfNotPresent
                                livenessProbe:
                                  failureThreshold: 6
                                  httpGet:
                                    httpHeaders:
                                      - name: Host
                                        value: '$OPENCART_DOMAIN'
                                    path: /administration/
                                    port: http
                                    scheme: HTTP
                                  initialDelaySeconds: 120
                                  periodSeconds: 10
                                  successThreshold: 1
                                  timeoutSeconds: 5
                                name: my-open-cart-app
                                ports:
                                  - containerPort: 8080
                                    name: http
                                    protocol: TCP
                                  - containerPort: 8443
                                    name: https
                                    protocol: TCP
                                readinessProbe:
                                  failureThreshold: 6
                                  httpGet:
                                    httpHeaders:
                                      - name: Host
                                        value: '$OPENCART_DOMAIN'
                                    path: /administration/
                                    port: http
                                    scheme: HTTP
                                  initialDelaySeconds: 30
                                  periodSeconds: 5
                                  successThreshold: 1
                                  timeoutSeconds: 3
                                resources:
                                  requests:
                                    cpu: 300m
                                    memory: 512Mi
                                securityContext:
                                  runAsNonRoot: true
                                  runAsUser: 1001
                                  allowPrivilegeEscalation: false
                                  capabilities:
                                    drop:
                                      - ALL
                                  seccompProfile:
                                    type: RuntimeDefault
                                terminationMessagePath: /dev/termination-log
                                terminationMessagePolicy: File
                                volumeMounts:
                                  - mountPath: /bitnami/opencart
                                    name: opencart-data
                                    subPath: opencart
                                  - mountPath: /bitnami/opencart_storage
                                    name: opencart-data
                                    subPath: opencart_storage
                            dnsPolicy: ClusterFirst
                            hostAliases:
                              - hostnames:
                                  - status.localhost
                                ip: 127.0.0.1
                            restartPolicy: Always
                            schedulerName: default-scheduler
                            securityContext:
                              fsGroup: 1001
                            terminationGracePeriodSeconds: 30
                            volumes:
                              - name: opencart-data
                                persistentVolumeClaim:
                                  claimName: open-cart-pvc
                      EOF

                      # Wait for OpenCart deployment to become ready
                      #=======================================
                      echo "Waiting for OpenCart deployment to become ready..."
                      kubectl rollout status deployment/my-open-cart-app -n opencart --timeout=1200s
                      if [ $? -ne 0 ]; then
                        echo "Failure: OpenCart deployment failed to become ready"
                        echo "=== Pods ==="
                        kubectl get pods -n opencart -o wide
                        echo "=== Pod Describe ==="
                        kubectl describe pods -n opencart
                        echo "=== PersistentVolumeClaims ==="
                        kubectl get pvc -n opencart
                        echo "=== Recent Events ==="
                        kubectl get events -n opencart --sort-by='.metadata.creationTimestamp'
                        exit 1
                      else
                        echo "Success: OpenCart deployment is ready"
                      fi
              restartPolicy: Never
              volumes:
                - name: cluster-kubeconfig-volume
                  secret:
                    secretName: ${to_k8s_name(env.deploymentName, 63)}-kubeconfig
                    items:
                      - key: value
                        path: vks-cluster-kubeconfig-admin
      wait:
        conditions:
          - indicatesFailure: false
            status: 'True'
            type: Complete
        fields:
          - indicatesFailure: true
            path: status.failed
            value: '1'
  VKS_Bootstrap:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CLUSTER
    createTimeout: 45m
    properties:
      context: ${resource.Namespace.id}
      existing: true
      manifest:
        apiVersion: run.tanzu.vmware.com/v1alpha3
        kind: ClusterBootstrap
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}
      wait:
        conditions:
          - indicatesFailure: false
            status: 'True'
            type: Guest-Cluster-Auth-Service-ReconcileSucceeded
          - indicatesFailure: false
            status: 'True'
            type: Kapp-Controller-ReconcileSucceeded
          - indicatesFailure: false
            status: 'True'
            type: Metrics-Server-ReconcileSucceeded
          - indicatesFailure: false
            status: 'True'
            type: Pinniped-ReconcileSucceeded
          - indicatesFailure: false
            status: 'True'
            type: Secretgen-Controller-ReconcileSucceeded
          - indicatesFailure: false
            status: 'True'
            type: Vsphere-Cpi-ReconcileSucceeded
          - indicatesFailure: false
            type: Vsphere-Pv-Csi-ReconcileSucceeded
            status: 'True'
  cert-manager-addon:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CM_Role_Binding
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: addons.kubernetes.vmware.com/v1alpha1
        kind: AddonInstall
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-cert-manager
        spec:
          addonRef:
            name: cert-manager
          clusters:
            - selector:
                matchLabels:
                  cluster.x-k8s.io/cluster-name: ${to_k8s_name(env.deploymentName, 63)}
  Opencart_CM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS_Job
    properties:
      existing: true
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-opencart-endpoints
  istio-secret:
    type: CCI.Supervisor.Resource
    dependsOn:
      - cert-manager-addon
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-istio-values
        stringData:
          values.yaml: |
            #@data/values
            #@overlay/match-child-defaults missing_ok=True
            ---
            gateways:
              ingress:
                enabled: true
  istio-addon:
    type: CCI.Supervisor.Resource
    dependsOn:
      - istio-secret
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: addons.kubernetes.vmware.com/v1alpha1
        kind: AddonInstall
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-istio
        spec:
          addonRef:
            name: istio
          addonConfigRef:
            name: ${to_k8s_name(env.deploymentName, 63)}-istio-values
            kind: Secret
          clusters:
            - selector:
                matchLabels:
                  cluster.x-k8s.io/cluster-name: ${to_k8s_name(env.deploymentName, 63)}
  CLUSTER:
    type: CCI.Supervisor.Resource
    dependsOn:
      - istio-addon
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: ControlPlaneInitialized
            status: 'True'
          - type: TopologyReconciled
            status: 'True'
          - type: WorkersAvailable
            status: 'True'
          - type: AddonsReconciled
            status: 'True'
        fields:
          - indicatesFailure: false
            path: status.phase
            value: Provisioned
          - indicatesFailure: false
            path: status.initialization.controlPlaneInitialized
            value: 'true'
          - indicatesFailure: false
            path: status.initialization.infrastructureProvisioned
            value: 'true'
      manifest:
        apiVersion: cluster.x-k8s.io/v1beta2
        kind: Cluster
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}
          labels:
            cluster.x-k8s.io/cluster-name: ${to_k8s_name(env.deploymentName, 63)}
        spec:
          clusterNetwork:
            pods:
              cidrBlocks:
                - 10.95.0.0/16
            services:
              cidrBlocks:
                - 10.96.0.0/12
            serviceDomain: cluster.local
          topology:
            classRef:
              name: ${propgroup.environment.clusterClass}
              namespace: vmware-system-vks-public
            version: ${propgroup.environment.vksVersion}
            variables:
              - name: vmClass
                value: ${input.vm_size}
              - name: storageClass
                value: ${input.storageclass}
              - name: kubernetes
                value:
                  security:
                    podSecurityStandard:
                      audit: restricted
                      enforce: privileged
                      warn: restricted
              - name: vsphereOptions
                value:
                  persistentVolumes:
                    availableStorageClasses:
                      - ${input.storageclass}
                    defaultStorageClass: ${input.storageclass}
            controlPlane:
              replicas: ${input.controlPlaneCount}
              metadata:
                annotations:
                  run.tanzu.vmware.com/resolve-os-image: os-name=photon, content-library=${propgroup.environment.vksContentLibraryId}
            workers:
              machineDeployments:
                - class: node-pool
                  name: ${to_k8s_name(env.deploymentName, 63)}-np
                  metadata:
                    annotations:
                      cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: ${input.maxWorkerCount}
                      cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: ${input.minWorkerCount}
                      run.tanzu.vmware.com/resolve-os-image: os-name=photon, content-library=${propgroup.environment.vksContentLibraryId}
