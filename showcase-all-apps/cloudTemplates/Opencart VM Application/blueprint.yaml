version: 2
formatVersion: 2
name: Opencart VM Application
description: Provision the Opencart application with a SQL and Apache VM
metadata:
  deploymentSettings:
    disableUpdateDay2Action: true
    hideDisabledDay2Actions: true
outputs:
  __deploymentOverview:
    value: |-
      ## Opencart Shopping Cart Application
      Opencart is an easy to-use, powerful, Open Source online store management program that can manage multiple online stores from a single back-end.
      For more details, check https://www.opencart.com/

      ### Application Details

      **OpenCart HTTP Url  :** http://${resource.SSH_HTTP_LB.object.status.loadBalancer.ingress[0].ip}

      **MySQL Host IP      :** ${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}
  openCartHttpUrl:
    value: ${resource.SSH_HTTP_LB.object.status.loadBalancer.ingress[0].ip}
    description: OpenCart HTTP Application URL
  mysqlHostIp:
    value: ${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}
    description: MySQL Database Load Balancer IP
inputs:
############################################
# Dynamic Data Retrieval for Known objects #
############################################
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vm_size:
    type: string
    title: Virtual Machine Class
    default: best-effort-large
    $data: /data/virtualmachineclasses?namespace={{namespace}}
  storageclass:
    type: string
    title: Storage Class
    $data: /data/storageclasses?namespace={{namespace}}
############################################# 
  username:
    type: string
    description: The username you would like to have for the installation.
    default: demouser
    title: System Admin Account Username
  password:
    type: string
    description: The password you would like to use for the ocuser account.
    title: OpenCart Admin Account Password
    default: VMware1!
    pattern: '[a-z0-9A-Z@#$]+'
    encrypted: true
resources:
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  SSH_HTTP_LB:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web
        spec:
          selector:
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-web
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
            - name: http
              protocol: TCP
              port: 80
              targetPort: 80
  SSH_MYSQL_LB:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-sql
        spec:
          selector:
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-sql
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
            - name: mysql
              protocol: TCP
              port: 3306
              targetPort: 3306
  Web_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - MYSQL_VM
      - Web_BOOTSTRAP
      - SSH_HTTP_LB
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: VirtualMachineTools
            status: 'True'
          - type: VirtualMachineGuestNetworkConfigSynced
            status: 'True'
          - type: VirtualMachineCreated
            status: 'True'
        #fields:
        #  - indicatesFailure: false
        #    path: status.phase
        #    value: Provisioned
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-web
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-web
        spec:
          className: ${input.vm_size}
          #Friendly image name: ubuntu-server-24.04-lts-noble
          imageName: ${propgroup.environment.ubuntu2404}
          storageClass: ${input.storageclass}
          powerState: PoweredOn
          network:
            domainName: ${propgroup.environment.domain}
            nameservers:
              - ${propgroup.environment.nameserver1}
              - ${propgroup.environment.nameserver2}
            searchDomains:
              - ${propgroup.environment.domain}
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${to_k8s_name(env.deploymentName, 63)}-web-bootstrap-secret
                key: user-data
  MYSQL_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - MySQL_BOOTSTRAP
      - SSH_MYSQL_LB
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: VirtualMachineTools
            status: 'True'
          - type: VirtualMachineGuestNetworkConfigSynced
            status: 'True'
          - type: VirtualMachineCreated
            status: 'True'
        #fields:
        #  - indicatesFailure: false
        #    path: status.phase
        #    value: Provisioned
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-sql
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-sql
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-sql
        spec:
          className: ${input.vm_size}
          #Friendly image name: ubuntu-server-18.04-lts-bionic-beaver
          imageName: ${propgroup.environment.ubuntu1804}
          storageClass: ${input.storageclass}
          powerState: PoweredOn
          network:
            domainName: ${propgroup.environment.domain}
            nameservers:
              - ${propgroup.environment.nameserver1}
              - ${propgroup.environment.nameserver2}
            searchDomains:
              - ${propgroup.environment.domain}
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${to_k8s_name(env.deploymentName, 63)}-sql-bootstrap-secret
                key: user-data
  Web_BOOTSTRAP:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web-bootstrap-secret
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-web
        stringData:
          user-data: |
            #cloud-config
            hostname: ${self.resourceName}
            package_upgrade: false
            package_reboot_if_required: false

            packages:
              - apache2
              - php
              - php-mysql
              - libapache2-mod-php
              - php-cli
              - php-common
              - php-intl
              - php-gd
              - php-mbstring
              - php-xml
              - php-zip
              - php-curl
              - unzip
              - open-vm-tools

            ssh_pwauth: true

            users:
              - name: ${input.username}
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: sudo
                shell: /bin/bash

              - name: ocuser
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: wheel, sudo, admin
                shell: /bin/bash

            chpasswd:
              expire: false
              users:
                - name: ${input.username}
                  password: ${input.password}
                  type: text
              
                - name: ocuser
                  password: ${input.password}
                  type: text

            write_files:
              - path: /etc/hosts
                content: |
                  127.0.0.1 ${self.resourceName}
                append: true

            runcmd:
              - systemctl stop apache2
              - USER=ocuser
              - PASS=${input.password}
              #------------------ Install OpenCart Demo --------------------#
              - wget --quiet -P /tmp/ http://${propgroup.environment.www}/downloads/opencart-demo.zip
              - unzip -q -o -d /tmp /tmp/opencart-demo.zip
              - rm -rf /var/www/opencart
              - mv /tmp/opencart-demo-master/ /var/www/opencart
              - chown -R www-data.www-data /var/www/opencart
              - chmod -R 775 /var/www/opencart
              - tee /etc/apache2/sites-available/opencart.conf > /dev/null << EOF
              - <VirtualHost *:80>
              -   ServerName www.opencart.cmbu.local
              -   DocumentRoot /var/www/opencart
              -   <Directory /var/www/opencart/>
              -     AllowOverride All
              -     allow from all
              -   </Directory>
              - </VirtualHost>
              - EOF
              - cd /etc/apache2/sites-available/
              - a2ensite opencart.conf
              - a2dissite 000-default.conf

                #----------------------- Set Website IP Address -----------------------#
              - export mysqlip=${resource.SSH_MYSQL_LB.object.status.loadBalancer.ingress[0].ip}
              - export ip4=${resource.SSH_HTTP_LB.object.status.loadBalancer.ingress[0].ip}
                #----------------------------------------------------------------------#

              - sed -i "s/frontendiphere/$ip4/g" /var/www/opencart/config.php
              - sed -i "s/dbiphere/$mysqlip/g" /var/www/opencart/config.php
              - sed -i "s/usernamehere/$USER/g" /var/www/opencart/config.php
              - sed -i "s/passwordhere/$PASS/g" /var/www/opencart/config.php
              - sed -i "s/frontendiphere/$ip4/g" /var/www/opencart/admin/config.php
              - sed -i "s/dbiphere/$mysqlip/g" /var/www/opencart/admin/config.php
              - sed -i "s/usernamehere/$USER/g" /var/www/opencart/admin/config.php
              - sed -i "s/passwordhere/$PASS/g" /var/www/opencart/admin/config.php
              - systemctl reload apache2
              - systemctl restart apache2
              - echo 'Cloud-init is done!' >> /tmp/finished.txt
              
  MySQL_BOOTSTRAP:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-sql-bootstrap-secret
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-sql
        stringData:
          user-data: |
            #cloud-config
            hostname: ${self.resourceName}
            package_upgrade: true
            package_reboot_if_required: true

            apt_source:
              - source: deb http://archive.ubuntu.com/ubuntu main universe multiverse restricted

            packages:
              - mysql-server-5.7
              - mysql-client
              - unzip
              - open-vm-tools

            ssh_pwauth: true

            users:
              - name: ${input.username}
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: wheel, sudo, admin
                shell: /bin/bash
                
              - name: ocuser
                lock_passwd: false
                sudo: ALL=(ALL) NOPASSWD:ALL
                groups: wheel, sudo, admin
                shell: /bin/bash

            chpasswd:
              expire: false
              users:
                - name: ${input.username}
                  password: ${input.password}
                  type: text
                  
                - name: ocuser
                  password: ${input.password}
                  type: text
              
            write_files:
              - path: /etc/cron.hourly/oc_cleanup
                owner: root
                permissions: '0777'
                content: "mysql -e 'use opencart; create table oc_session_copy like oc_session; drop table oc_session; rename table oc_session_copy to oc_session; source /tmp/opencart.sql;'"
              
              - path: /etc/hosts
                content: |
                  127.0.0.1 ${self.resourceName}
                  185.125.190.82 security.ubuntu.com
                  185.125.190.82 archive.ubuntu.com
                append: true

            runcmd:
              - export DEBIAN_FRONTEND=noninteractive
              - USER=ocuser
              - PASS=${input.password}
              - echo "mysql-server-5.7 mysql-server/root_password password root" | sudo debconf-set-selections
              - echo "mysql-server-5.7 mysql-server/root_password_again password root" | sudo debconf-set-selections
              - echo "[client]" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              - echo "user=root" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              - echo "password=root" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              - echo "user=ocuser" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              - echo "password=$PASS" >> /etc/mysql/mysql.conf.d/mysqld.cnf
              - sed -i 's/#slow/slow/g' /etc/mysql/mysql.conf.d/mysqld.cnf
              - sed -i 's/#long_query_time/long_query_time/g' /etc/mysql/mysql.conf.d/mysqld.cnf
              - sed -i 's/bind-address/#bind-address/g' /etc/mysql/mysql.conf.d/mysqld.cnf
              - systemctl restart mysql
              - mysql -u root -e "GRANT ALL ON *.* TO '$USER'@'%' IDENTIFIED BY '$PASS'"
              - mysql -u root -e 'CREATE DATABASE opencart'
              - mysql -u root -e 'USE opencart'
              - mysql -u root -e 'flush privileges'
              - wget --quiet -P /tmp/ http://${propgroup.environment.www}/downloads/opencart-demo.zip
              - unzip -q -o -d /tmp /tmp/opencart-demo.zip
              - cp /tmp/opencart-demo-master/install/opencart.sql /tmp/opencart.sql
              - mysql -u root opencart < /tmp/opencart.sql
              - mysql -u root opencart -e "INSERT INTO oc_user (user_id,user_group_id,username,password,salt,firstname,lastname,email,image,code,ip,status,date_added) VALUES (1,1,'admin','5feaa046f6927df3d744007ec1491dba838f672e','c4wnfrq9J','demo','user','admin@admin.com','none','none','none',1,'2019-01-31 06:29:09')"
              - echo 'Cloud-init is done!' >> /tmp/finished.txt
