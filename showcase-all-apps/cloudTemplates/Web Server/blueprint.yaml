formatVersion: 2
name: Web Servers
description: Deploy a Apache Web Server
version: 4
metadata:
  deploymentSettings:
    disableUpdateDay2Action: false
    hideDisabledDay2Actions: true
outputs:
  __deploymentOverview:
    value: |-
      ## <img src="https://raw.githubusercontent.com/VMwareCMBUTMM/showcase-9/ba68782b1bff84d34b886142d2970e701b43b586/showcase-all-apps/cloudTemplates/icons/success.svg" alt="Apache Logo" width="100" height="100"> Web Server Deployment


      |      **Deployment Details**                   |
      |-----------------------------------------------|
      |      **Load Balancer Url   :** http://${resource.SSH_HTTP_LB.object.status.loadBalancer.ingress[0].ip}      |
inputs:
############################################
# Dynamic Data Retrieval for Known objects #
############################################
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vm_size:
    type: string
    title: Virtual Machine Class
    default: best-effort-small
    $data: /data/virtualmachineclasses?namespace={{namespace}}
  storageclass:
    type: string
    title: Storage Class
    $data: /data/storageclasses?namespace={{namespace}}
#############################################
resources:
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  SSH_HTTP_LB:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web
        spec:
          selector:
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-web
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
            - name: http
              protocol: TCP
              port: 80
              targetPort: 80
  Web_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Web_BOOTSTRAP
      - SSH_HTTP_LB
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: VirtualMachineTools
            status: 'True'
          - type: VirtualMachineHardwareVolumesVerified
            status: 'True'
          - type: GuestCustomization
            status: 'True'
          - type: VirtualMachineCreated
            status: 'True'
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-web
            vm-lb-selector: ${to_k8s_name(env.deploymentName, 63)}-web
        spec:
          className: ${input.vm_size}
          #Friendly image name: ubuntu-server-24.04-lts
          imageName: ${propgroup.environment.ubuntu2404}
          storageClass: ${input.storageclass}
          powerState: PoweredOn
          network:
            domainName: ${propgroup.environment.domain}
            nameservers:
              - ${propgroup.environment.nameserver1}
              - ${propgroup.environment.nameserver2}
            searchDomains:
              - ${propgroup.environment.domain}
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${to_k8s_name(env.deploymentName, 63)}-web-bootstrap-secret
                key: user-data
  Web_BOOTSTRAP:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${to_k8s_name(env.deploymentName, 63)}-web-bootstrap-secret
          labels:
            vm-selector: ${to_k8s_name(env.deploymentName, 63)}-web
        stringData:
          user-data: |
            #cloud-config
            hostname: ${self.resourceName}
            package_upgrade: true
            package_reboot_if_required: false
            apt_source:
              - source: deb http://archive.ubuntu.com/ubuntu main universe multiverse restricted

            packages:
              - apache2

            runcmd:
              ### update the top of the web page to the web servers resource name
              - sed -i 's/Apache2 Ubuntu Default Page/Showcase Web Server ${env.deploymentName}/g' /var/www/html/index.html
              
              ### Set to show detailed apache metrics with the telegraf agent
              - sed -i '/Require local/a \\tRequire all granted' /etc/apache2/mods-enabled/status.conf
              
              ### Restart services
              - systemctl reload apache2
              - systemctl restart apache2
              
              - echo 'Apache Installed' >> /tmp/finished.txt
              - echo 'Cloud-init is done!' >> /tmp/finished.txt
